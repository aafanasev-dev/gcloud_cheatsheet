server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Module scripts and workers are refused outright if the MIME type is
    # wrong, so be explicit rather than trusting the inherited mime.types.
    types {
        text/html                  html;
        text/css                   css;
        text/javascript            js mjs;
        image/svg+xml              svg;
        image/x-icon               ico;
        application/manifest+json  webmanifest;
    }
    default_type application/octet-stream;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript image/svg+xml;

    # Asset filenames are not content-hashed, so a year of immutable caching
    # would pin browsers to stale code across a deploy. ETag revalidation costs
    # one cheap 304 and is always correct.
    #
    # NOTE: nginx only inherits add_header from an outer block when the inner
    # block declares none of its own. Keeping every header at server level —
    # and adding no add_header inside a location — is what makes them apply.
    add_header Cache-Control          "no-cache"   always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()" always;

    # The site is fully self-contained: no CDN, no inline script, no network
    # calls. That lets the policy stay this tight.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Routing is hash-based (#/topic/sub), so every real path is a file:
    # a missing one is a 404, not index.html under a misleading 200.
    location / {
        try_files $uri $uri/ =404;
    }
}
