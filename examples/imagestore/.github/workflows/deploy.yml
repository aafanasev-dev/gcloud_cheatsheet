# Keyless CI/CD: GitHub's OIDC token is exchanged for short-lived Google
# credentials through Workload Identity Federation; no JSON key is stored.
name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write   # lets the job request a GitHub OIDC token
env:
  PROJECT_ID: my-imagestore
  REGION: europe-west1
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: imagestore-deployer@my-imagestore.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy API and processor (new revisions keep their existing config)
        run: |
          gcloud run deploy imagestore-api --source=api --region=$REGION --quiet
          gcloud run deploy imagestore-processor --source=processor --region=$REGION --quiet
