# API Gateway config (Swagger 2.0). BACKEND_URL is replaced with the petsApi
# function URL at deploy time; the gateway calls it with its own service
# account, and clients must send an API key in the x-api-key header.
swagger: "2.0"
info:
  title: petshop-api
  description: Petshop public API
  version: 1.0.0
schemes: [https]
produces: [application/json]
x-google-backend:
  address: BACKEND_URL
  path_translation: APPEND_PATH_TO_ADDRESS
  deadline: 30.0
security:
  - api_key: []
securityDefinitions:
  api_key:
    type: apiKey
    name: x-api-key
    in: header
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets available for adoption
      parameters:
        - { name: species, in: query, type: string, required: false }
      responses:
        "200": { description: Available pets }
    post:
      operationId: createPet
      summary: Add a pet (Gemini writes the profile from its photo)
      consumes: [application/json]
      parameters:
        - in: body
          name: pet
          required: true
          schema:
            type: object
            required: [name, species]
            properties:
              name: { type: string }
              species: { type: string }
              age: { type: integer }
              photo: { type: string, description: "gs://BUCKET/path.jpg" }
      responses:
        "201": { description: Created }
  /pets/{id}:
    get:
      operationId: getPet
      parameters:
        - { name: id, in: path, type: string, required: true }
      responses:
        "200": { description: The pet }
        "404": { description: Not found }
  /pets/{id}/adopt:
    post:
      operationId: adoptPet
      consumes: [application/json]
      parameters:
        - { name: id, in: path, type: string, required: true }
        - in: body
          name: adoption
          required: true
          schema:
            type: object
            required: [adopter]
            properties:
              adopter: { type: string }
      responses:
        "200": { description: Adopted }
        "409": { description: Already adopted }
